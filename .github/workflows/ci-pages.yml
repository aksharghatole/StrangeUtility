name: Verify and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
  package:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.name.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python apps/paperwork/prepare_vendor.py
      - name: Stage static application directory
        run: |
          mkdir -p site/apps/paperwork site/apps/blind site/apps/tabledelta site/apps/wavecut site/apps/slotweave site/apps/dataforge site/packages/ui site/portal
          cp index.html registry.json site/
          cp packages/ui/portal.css site/packages/ui/
          cp portal/portal.js site/portal/
          cp apps/paperwork/index.html apps/paperwork/sw.js apps/paperwork/offline-assets.js site/apps/paperwork/
          cp -R apps/paperwork/vendor site/apps/paperwork/
          cp apps/blind/index.html apps/blind/sw.js apps/blind/manifest.webmanifest apps/blind/icon.svg site/apps/blind/
          cp apps/tabledelta/index.html apps/tabledelta/style.css apps/tabledelta/app.mjs apps/tabledelta/core.mjs apps/tabledelta/sw.js site/apps/tabledelta/
          cp apps/wavecut/index.html apps/wavecut/style.css apps/wavecut/app.mjs apps/wavecut/core.mjs site/apps/wavecut/
          cp apps/slotweave/index.html apps/slotweave/core.mjs site/apps/slotweave/
          cp apps/dataforge/index.html apps/dataforge/core.mjs site/apps/dataforge/
          python scripts/check-pages.py site
      - name: Set artifact name
        id: name
        run: echo "artifact_name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Wait for the packaged artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
        run: |
          test -n "$ARTIFACT_NAME"
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false)] | length') || count=0
            if [ "$count" = 1 ]; then exit 0; fi
            if [ "$count" -gt 1 ]; then echo "::error::Duplicate deployment artifact"; exit 1; fi
            sleep 5
          done
          echo "::error::Deployment artifact unavailable or expired; rerun all jobs to rebuild"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}
