name: Blind Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/blind/**'
      - '.github/workflows/blind-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/blind/**'
      - '.github/workflows/blind-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK
        run: |
          command -v sdkmanager
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p apps/blind/android :app:assembleDebug --no-daemon
      - run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose apps/blind/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blind-Android-debug
          path: apps/blind/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
