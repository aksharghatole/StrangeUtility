name: Daily Discovery integration
on:
  pull_request:
    paths:
      - 'apps/daily-discovery/**'
      - '.github/workflows/daily-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'apps/daily-discovery/**'
      - '.github/workflows/daily-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/daily-discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check runtime databases excluded
        run: |
          test ! -e data/test_auth.sqlite3
          test ! -e .env
      - run: python -m compileall -q backend config database providers scheduler services ui
      - run: python -m pytest -q tests --ignore=tests/test_auth.py
      - run: python -m pytest -q tests/test_auth.py
      - run: python -m pytest -q backend/tests
        env:
          DATABASE_URL: sqlite:///./data/ci_api.db
