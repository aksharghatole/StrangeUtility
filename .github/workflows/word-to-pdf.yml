name: Word-to-PDF integration
on:
  pull_request:
    paths:
      - 'apps/word-to-pdf/**'
      - '.github/workflows/word-to-pdf.yml'
  push:
    branches: [main]
    paths:
      - 'apps/word-to-pdf/**'
      - '.github/workflows/word-to-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/word-to-pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu fonts-liberation
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -v
      - run: node --check frontend/app.js

      - name: Build and smoke-test non-root container
        run: |
          docker build -t strangeutility-word-to-pdf-test -f backend/Dockerfile .
          docker run --rm --entrypoint id strangeutility-word-to-pdf-test -u | grep -qx 10001
          docker run -d --name word-pdf-test -p 127.0.0.1:18000:8000 strangeutility-word-to-pdf-test
          trap 'docker rm -f word-pdf-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/health; then break; fi
            sleep 1
          done
          printf 'Synthetic container smoke test' > /tmp/word-test.txt
          curl --fail --max-time 90 -F file=@/tmp/word-test.txt http://127.0.0.1:18000/api/convert -o /tmp/word-test.pdf
          head -c 5 /tmp/word-test.pdf | grep -q '%PDF-'
