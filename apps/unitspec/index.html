<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UnitSpec</title><style>body{font:16px system-ui;background:#eef2f4;color:#172b38;margin:0}main{max-width:720px;margin:auto;padding:24px}textarea,button{font:inherit}textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #456;border-radius:8px}button{padding:12px;background:#124b5a;color:white;border:0;border-radius:6px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:8px}a{color:#124b5a}</style><main><a href="../../">StrangeUtility</a><h1>UnitSpec</h1><p>Calculate a one-dimensional assembly tolerance stack privately.</p><label for="dimensions">One dimension per line: direction, nominal, minus tolerance, plus tolerance (same unit)</label><textarea id="dimensions" rows="8">+,120,0.1,0.1
-,25,0.05,0.05
-,70,0.08,0.08
-,24.5,0.06,0.06</textarea><button id="calculate">Calculate</button><button id="save" disabled>Export JSON</button><pre id="result" role="status"></pre><p>RSS assumes independent centered dimensions with comparable statistical coverage. It is not a guaranteed limit. No geometric tolerances or correlated processes. Verify engineering decisions independently.</p></main><script type="module">import {stack} from './core.mjs';const input=document.getElementById('dimensions'),out=document.getElementById('result'),save=document.getElementById('save');let report;input.addEventListener('input',()=>{report=null;save.disabled=true;out.textContent='Recalculate after editing.'});document.getElementById('calculate').onclick=()=>{try{const rows=input.value.trim().split(/\n/).map(line=>{const fields=line.split(',').map(x=>x.trim());if(fields.length!==4||!['+','-'].includes(fields[0])||fields.slice(1).some(x=>!x))throw Error('Use four fields per line');return {sign:fields[0]==='+'?1:-1,n:Number(fields[1]),minus:Number(fields[2]),plus:Number(fields[3])}});const r=stack(rows);report={rows,...r};out.textContent=Object.entries(r).map(([k,v])=>k+': '+Number(v.toPrecision(10))).join('\n');save.disabled=false}catch(e){out.textContent=e.message;report=null;save.disabled=true}};save.onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='unitspec.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
