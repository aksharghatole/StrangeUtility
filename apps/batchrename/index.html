<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BatchRename</title><style>body{font:1rem system-ui;max-width:55rem;margin:auto;padding:1rem;background:#faf9f6;color:#202020}label{display:block;margin:1rem 0}input,textarea,button{font:inherit;padding:.5rem;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:10rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{margin:.3rem}a{color:#174c85}</style><main><a href="../../">All utilities</a><h1>BatchRename</h1><p>Preview bulk filename changes without modifying files. Export a JSON mapping for review; no files are uploaded or renamed.</p><label>Choose files (names only)<input id="files" type="file" multiple></label><label>One filename per line<textarea id="names" maxlength="1300000"></textarea></label><label>Find in name (literal)<input id="find"></label><label>Replace with<input id="replace"></label><label>Prefix<input id="prefix"></label><label>Suffix before extension<input id="suffix"></label><label><input id="numbered" type="checkbox"> Add sequential numbers</label><label>Starting number<input id="start" type="number" min="0" max="999999" value="1"></label><button id="preview">Preview</button><button id="save" disabled>Export JSON</button><p id="status" role="status"></p><pre id="results"></pre></main><script type="module">import{plan,exportPlan}from './core.mjs';const $=id=>document.getElementById(id);let rows=[];function invalidate(){$('save').disabled=true;$('results').textContent='';$('status').textContent='Preview required';}document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',invalidate));$('files').onchange=()=>{$('names').value=Array.from($('files').files,f=>f.name).join('\n');invalidate()};$('preview').onclick=()=>{invalidate();try{rows=plan($('names').value.split(/\r?\n/).filter(s=>s!==''),{find:$('find').value,replace:$('replace').value,prefix:$('prefix').value,suffix:$('suffix').value,numbered:$('numbered').checked,start:$('start').value===''?NaN:Number($('start').value)});const errors=rows.filter(r=>r.error).length;$('status').textContent=rows.length+' names; '+errors+' errors';$('results').textContent=rows.map(r=>r.original+' → '+r.target+(r.error?' — '+r.error:'')).join('\n');$('save').disabled=errors>0}catch(e){$('status').textContent=e.message}};$('save').onclick=()=>{const url=URL.createObjectURL(new Blob([exportPlan(rows)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='rename-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
