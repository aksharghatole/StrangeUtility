<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlotWeave</title><style>body{font:1rem system-ui;background:#f5f3ed;color:#202b28;margin:0}main{max-width:760px;margin:auto;padding:24px}h1{font-size:2.5rem}fieldset{display:flex;flex-wrap:wrap;gap:12px;border:1px solid #a4b1a8;border-radius:12px;margin:12px 0;padding:16px;background:white}label{display:grid;gap:5px}input,button{font:inherit;padding:10px;border:1px solid #66766e;border-radius:6px;max-width:100%;box-sizing:border-box}button{background:#214d3e;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b66b00;outline-offset:3px}output{display:block;padding:20px;background:white;border-radius:12px;margin:16px 0}a{color:#214d3e}</style></head><body><main><a href="../../">StrangeUtility</a><h1>SlotWeave</h1><p>Find a shared meeting window without sharing calendars. Enter one same-day availability interval per person, in the same time zone.</p><form id="form"><div id="people"></div><button type="button" id="add">Add person</button><p><label>Meeting duration (minutes)<input id="duration" type="number" min="1" max="1440" value="30" required></label></p><button>Find overlap</button></form><output id="result" aria-live="polite">Add availability to begin.</output><button id="download" disabled>Download result</button><p>Preview 0.1 · No uploads or saved personal data. Overnight windows and time zone conversion are not supported.</p></main><script type="module">
import {overlap,format} from './core.mjs';
const people=document.querySelector('#people'),result=document.querySelector('#result'),download=document.querySelector('#download');let report='',serial=0;
function invalidate(){report='';download.disabled=true;result.textContent='Availability changed. Find overlap again.'}
function add(){if(people.children.length>=100)return;const f=document.createElement('fieldset');f.innerHTML='<legend>Person '+(++serial)+'</legend><label>Available from<input type="time" class="start" value="09:00" required></label><label>Available until<input type="time" class="end" value="17:00" required></label><button type="button">Remove</button>';f.querySelector('button').onclick=()=>{if(people.children.length>1){f.remove();invalidate()}};people.append(f);invalidate()}
add();add();document.querySelector('#add').onclick=add;document.querySelector('#form').addEventListener('input',invalidate);
document.querySelector('#form').onsubmit=e=>{e.preventDefault();try{const rows=[...people.children].map(f=>({start:f.querySelector('.start').value,end:f.querySelector('.end').value}));const duration=Number(document.querySelector('#duration').value);const v=overlap(rows,duration);report=v?'Shared window: '+format(v.start)+'–'+format(v.end)+' ('+v.minutes+' minutes). Earliest meeting: '+format(v.start)+'–'+format(v.start+duration)+'.':'No shared window fits '+duration+' minutes.';result.textContent=report;download.disabled=false}catch(err){invalidate();result.textContent=err.message}};
download.onclick=()=>{const url=URL.createObjectURL(new Blob([report+'\n'],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='slotweave.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
